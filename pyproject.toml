[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exo-base-model"
version = "0.1.0"
description = "t-PatchGNN for irregular exogenous forecasting with PDFormer-style pattern retrieval"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.4", "scikit-learn>=1.3", "tslearn>=0.6.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
exo-train = "exobase.train:cli"
exo-prepare = "exobase.prepare:cli"
exo-predict = "exobase.predict:cli"

[tool.setuptools.packages.find]
include = ["exobase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
